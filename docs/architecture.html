<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="How the SOP Sketchpad works inside, on one page: the three readers, the shared cut, SOP Lang, the engine, the VSS composer and its worlds, SOP-BERT, the models, the data, the training and the measurements.">
<title>SOP Sketchpad architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="help/docs.css">
<style>
/* This page shows the "How it works inside" pages of the demo's Help (docs/js/docs-arch.js) one after another, for reading, printing and
   searching in one place. It has no text of its own: change the pages in docs/js/docs-arch.js. Colours: the tokens of docs/index.html. */
:root {
  --app: #DADFE3; --head: #F0F2F5; --mine: #D9FDD3; --ink: #111B21; --muted: #667781; --faint: #8C9AA3; --line: #D1D7DB;
  --accent: #00A884; --accent-ink: #FFFFFF; --link: #027EB5; --err: #C1392B; --warn-soft: #FFF3D6; --canvas: #FFFFFF; --frame: #C8D0D6;
  --sheet: #FFFFFF; --code-bg: #F6F8F9; --wid: #1D4ED8; --rf: #A64B12; --str: #127A52;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app: #0C1317; --head: #202C33; --mine: #005C4B; --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942;
    --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --err: #F1786B; --warn-soft: #3A3018; --canvas: #111B21; --frame: #2E3D46;
    --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --app: #0C1317; --head: #202C33; --mine: #005C4B; --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942;
  --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --err: #F1786B; --warn-soft: #3A3018; --canvas: #111B21; --frame: #2E3D46;
  --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 12px; }
body { margin: 0; background: var(--app); color: var(--ink); font-family: var(--font); }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.top { background: var(--head); border-bottom: 1px solid var(--line); }
.top .in { max-width: 920px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 19px; flex: none; }
.top .who { flex: 1; min-width: 200px; }
.top b { display: block; font-size: 16px; font-weight: 600; }
.top span { display: block; font-size: 13px; color: var(--muted); }
.top .links { display: flex; gap: 14px; font-size: 14px; flex-wrap: wrap; }
main { max-width: 920px; margin: 0 auto; padding: 8px 16px 48px; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px 24px; margin-top: 14px; }
.toc { padding-left: 22px; columns: 2 260px; column-gap: 28px; }
.toc li { break-inside: avoid; margin: 3px 0; }
.sheet .doc-pn { display: none; }
@media (max-width: 560px) {
  main { padding: 4px 10px 40px; }
  .sheet { padding: 16px 14px 18px; border-radius: 8px; }
  .top .in { padding: 10px 12px; }
}
@media print { body { background: #fff; } .sheet { border: 0; padding: 0; } .top .links { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="avatar" aria-hidden="true">S</div>
  <div class="who"><b>SOP Sketchpad: how it works inside</b><span id="asof">Architecture</span></div>
  <div class="links"><a href="index.html">Open the demo</a><a href="index.html#help/architecture">These pages in the demo’s Help</a></div>
</div></header>
<main id="main">
<div class="sheet doc"><h1>Architecture of the SOP Sketchpad</h1>
<p class="lead">The “How it works inside” pages of the demo’s Help, on one page. The ideas behind them are in the Help’s
<a href="index.html#help/why-three">Concepts</a>.</p>
<nav aria-label="Contents"><ol class="toc" id="toc"></ol></nav>
<noscript><p>This page is built from <code>js/docs-arch.js</code> and needs JavaScript.</p></noscript>
</div>
</main>
<script src="js/docs-arch.js"></script>
<script>
/* One section per page of docs/js/docs-arch.js, in order. Links "#help/<page>[/<anchor>]" point to this page's own sections when the page
   is one of these, and to the demo's Help otherwise. Only the first copy of the shared arrow-head marker is kept (ids must be unique). */
(function () {
  const A = window.DocsArch, esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ids = new Set(A.pages.map(p => p.id));
  const link = html => html.replace(/href="#help\/([\w-]+)(?:\/([\w-]+))?"/g, (m, id, anchor) => ids.has(id) ? `href="#${anchor || id}"` : `href="index.html#help/${id}${anchor ? '/' + anchor : ''}"`);
  let markerSeen = false;
  const oneMarker = html => html.replace(/<defs><marker id="ah"[\s\S]*?<\/defs>/g, m => { if (markerSeen) return ''; markerSeen = true; return m; });
  document.getElementById('asof').textContent = 'As it is on ' + A.AS_OF;
  document.getElementById('toc').innerHTML = A.pages.map(p => `<li><a href="#${p.id}">${esc(p.title)}</a></li>`).join('');
  const main = document.getElementById('main');
  main.insertAdjacentHTML('beforeend', A.pages.map(p => `<section class="sheet doc" id="${p.id}"><h2 style="border:0;padding:0;margin-top:0;font-size:24px">${esc(p.title)}</h2>${p.lead ? `<p class="lead">${esc(p.lead)}</p>` : ''}${oneMarker(link(p.html)).replace(/<(\/?)h2\b/g, '<$1h3')}</section>`).join(''));
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
