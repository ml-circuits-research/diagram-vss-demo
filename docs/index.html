<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Talk to a diagram editor in English. Rules, a VSS reader and transformer readers formalize each message into SOP Lang wires that one engine runs.">
<title>SOP Sketchpad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a messaging app with a drawing board pinned beside it (desktop) or above it (phone).
   Chat bubbles carry plain-language replies; wires, patches and model evidence live in History. */
:root {
  --app: #DADFE3;
  --head: #F0F2F5;
  --chat: #EFEAE2;
  --dots: rgba(17, 27, 33, .05);
  --bubble: #FFFFFF;
  --mine: #D9FDD3;
  --ink: #111B21;
  --muted: #667781;
  --faint: #8C9AA3;
  --line: #D1D7DB;
  --accent: #00A884;
  --accent-ink: #FFFFFF;
  --link: #027EB5;
  --pill: #FFFFFF;
  --err: #C1392B;
  --warn-soft: #FFF3D6;
  --canvas: #FFFFFF;
  --grid: #E1E5E8;
  --frame: #C8D0D6;
  --edge: #3B4A54;
  --shape-edge: rgba(17, 27, 33, .45);
  --hl: #027EB5;
  --sheet: #FFFFFF;
  --code-bg: #F6F8F9;
  --wid: #1D4ED8;
  --rf: #A64B12;
  --str: #127A52;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --app: #0C1317; --head: #202C33; --chat: #0B141A; --dots: rgba(233, 237, 239, .035); --bubble: #202C33; --mine: #005C4B;
    --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942; --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --pill: #182229;
    --err: #F1786B; --warn-soft: #3A3018; --canvas: #111B21; --grid: #1E2A31; --frame: #2E3D46; --edge: #AEBAC1; --shape-edge: rgba(233, 237, 239, .4);
    --hl: #53BDEB; --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --app: #0C1317; --head: #202C33; --chat: #0B141A; --dots: rgba(233, 237, 239, .035); --bubble: #202C33; --mine: #005C4B;
  --ink: #E9EDEF; --muted: #8696A0; --faint: #667781; --line: #2A3942; --accent: #00A884; --accent-ink: #0B141A; --link: #53BDEB; --pill: #182229;
  --err: #F1786B; --warn-soft: #3A3018; --canvas: #111B21; --grid: #1E2A31; --frame: #2E3D46; --edge: #AEBAC1; --shape-edge: rgba(233, 237, 239, .4);
  --hl: #53BDEB; --sheet: #111B21; --code-bg: #0B141A; --wid: #8EA5FF; --rf: #F0A06A; --str: #6CD4A0; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--app); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- app grid ---------- */
.app { height: var(--app-h, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "stage head" "stage msgs" "stage player" "stage comp"; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.head { grid-area: head; background: var(--head); display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-left: 1px solid var(--line); min-width: 0; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; font-size: 19px; flex: none; }
.who { flex: 1; min-width: 0; }
.who b { display: block; font-weight: 600; font-size: 16px; }
.who span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.ib:hover { background: rgba(127, 127, 127, .14); color: var(--ink); }

.stage { grid-area: stage; position: relative; background: var(--canvas); min-height: 0; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
/* reader tabs: each reader (Rules, VSS, Neural) has its own drawing; the canvas shows the active one */
.rbar { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 10px 0 16px; border-bottom: 1px solid var(--line); background: var(--head); min-width: 0; }
.rtabs { display: flex; gap: 2px; flex: 1; min-width: 0; }
.rtab { border: 0; background: none; padding: 8px 12px 9px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.rtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.rtab.off { font-weight: 500; opacity: .62; }
.rtab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rf); display: inline-block; }
.rtab .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tools { display: flex; gap: 4px; flex: none; padding-bottom: 4px; }
.tools .ib { width: 36px; height: 36px; }
.tools .ib svg.i { width: 19px; height: 19px; }
.board { position: relative; min-height: 0; min-width: 0; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.rcard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow-wrap: anywhere; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 20px); overflow-y: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); font-size: 13.5px; display: grid; gap: 6px; }
.rcard.small { top: 12px; transform: translateX(-50%); }
.rcard p { margin: 0; color: var(--muted); }
.rcard .prog, .nbox .prog { margin: 4px 0 0; }
.acts { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.nbox { display: grid; gap: 6px; font-size: 13.5px; }
.nbox p { margin: 0; color: var(--muted); }
.sopbar { border-top: 1px solid var(--line); background: var(--head); padding: 5px 16px 7px; display: grid; gap: 4px; min-width: 0; }
.sophead { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); min-height: 24px; }
.sophead span { flex: 1; min-width: 0; }
.sophead .btn { padding: 2px 12px; font-size: 12.5px; }
.sop.mini { font-size: 11.5px; line-height: 1.5; padding: 4px 8px; max-height: 5.2em; overflow: auto; }
.readout { position: absolute; left: 16px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--head); padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }

.shp { cursor: grab; touch-action: none; }
.shp .body { stroke: var(--shape-edge); stroke-width: 1.25; }
.shp .body.outlined { stroke-width: 3; }
.shp .tag { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.shp .lbl { font-family: var(--font); font-weight: 500; pointer-events: none; }
.shp.hl .halo { stroke: var(--hl); stroke-width: 2.5; fill: none; stroke-dasharray: 5 4; animation: march 1.2s linear infinite; }
.shp.hl .tag { fill: var(--hl); font-weight: 600; }
.edge .ln { stroke: var(--edge); stroke-width: 1.75; fill: none; }
.edge .hd { fill: var(--edge); }
.edge.hl .ln { stroke: var(--hl) !important; stroke-width: 3; }
.edge.hl .hd { fill: var(--hl) !important; }
.edge .elbl { font-family: var(--font); font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--canvas); stroke-width: 4px; stroke-linejoin: round; }
.frame { fill: none; stroke: var(--frame); stroke-dasharray: 6 6; }
.ftitle { font-family: var(--font); font-size: 13px; fill: var(--faint); font-weight: 600; }
.empty-note { font-family: var(--font); font-size: 16px; fill: var(--faint); }
@keyframes march { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { .shp.hl .halo { animation: none; } }

/* ---------- messages ---------- */
.msgs { grid-area: msgs; overflow-y: auto; overscroll-behavior: contain; background-color: var(--chat); background-image: radial-gradient(var(--dots) 1.2px, transparent 1.3px); background-size: 18px 18px; padding: 12px 4% 8px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--line); min-width: 0; }
.b { max-width: 86%; padding: 6px 9px 5px; border-radius: 8px; background: var(--bubble); box-shadow: 0 1px .5px rgba(11, 20, 26, .13); position: relative; overflow-wrap: anywhere; }
.b.me { align-self: flex-end; background: var(--mine); border-top-right-radius: 2px; }
.b.bot { align-self: flex-start; border-top-left-radius: 2px; }
.b + .b.me, .b.me + .b.bot { margin-top: 6px; }
.b .txt { white-space: pre-wrap; }
.b .rl { white-space: pre-wrap; }
.b .rl + .rl { margin-top: 3px; }
.b .rl > b { font-weight: 600; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.b .rl.err .t { color: var(--err); }
.b .rl.off { color: var(--muted); font-size: 13px; }
.b .rl .sub { white-space: normal; }
.b .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.b.err .txt { color: var(--err); }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.meta button { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-size: 11.5px; }
.meta .tag2 { font-family: var(--mono); font-size: 10.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chips button { border: 1px solid var(--line); background: var(--pill); color: var(--link); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.sys { overflow-wrap: anywhere; align-self: center; background: var(--pill); color: var(--muted); font-size: 12.5px; padding: 4px 12px; border-radius: 8px; margin: 8px 0; text-align: center; max-width: 90%; box-shadow: 0 1px .5px rgba(11, 20, 26, .1); }
.sys.invite { max-width: min(460px, 94%); line-height: 1.45; }
.sys.invite .acts { display: flex; justify-content: center; margin-top: 6px; }
.sys.invite .st { display: block; margin-top: 4px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

/* ---------- player & composer ---------- */
.player { grid-area: player; background: var(--head); border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
.player .pl-t { flex: 1; min-width: 0; }
.player .pl-t b { font-weight: 600; }
.player .pl-t span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbtn { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.pbtn.ghost { background: transparent; color: var(--link); }
.comp { grid-area: comp; background: var(--head); display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px max(8px, env(safe-area-inset-bottom, 0px)); border-left: 1px solid var(--line); }
.comp .field { flex: 1; min-width: 0; background: var(--pill); border-radius: 22px; display: flex; align-items: flex-end; padding: 0 6px 0 14px; }
.comp textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; padding: 10px 0; max-height: 128px; line-height: 1.35; font-size: 15.5px; }
.comp textarea:focus { outline: none; }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.send svg.i { width: 20px; height: 20px; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(11, 20, 26, .4); z-index: 20; }
.sheet { position: fixed; z-index: 21; background: var(--sheet); display: flex; flex-direction: column; top: 0; right: 0; bottom: 0; width: min(560px, 100%); box-shadow: -8px 0 24px rgba(0, 0, 0, .18); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 0 16px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; }
.stabs { display: flex; gap: 2px; padding: 4px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.stab { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 500; white-space: nowrap; font-size: 14px; }
.stab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.sbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 24px; font-size: 14px; }
.intro { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; max-width: 68ch; }
h3.sub { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
h3.sub:first-child { margin-top: 0; }

/* examples */
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--pill); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; text-align: left; }
.quick button:hover { border-color: var(--accent); }
.sc-list { display: grid; gap: 8px; }
.sc { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.sc header { display: flex; align-items: baseline; gap: 8px; }
.sc h4 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
.sc .len { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sc p { margin: 0; color: var(--muted); font-size: 13px; }
.sc .row2 { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13.5px; color: var(--link); font-weight: 500; }
.btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
#sc-text { width: 100%; border: 1px solid var(--line); background: var(--code-bg); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; resize: vertical; }
.status { font-size: 12.5px; color: var(--muted); }
.opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
select { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 4px 8px; max-width: 100%; }

/* technical: history, legend, plugins, world, formalizer */
.turn { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--sheet); }
.turn > summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
.turn > summary::-webkit-details-marker { display: none; }
.turn > summary time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.turn > summary span { flex: 1; min-width: 0; }
.turn > summary em { font-style: normal; font-size: 11px; font-family: var(--mono); color: var(--muted); flex: none; }
.turn[open] > summary { border-bottom: 1px solid var(--line); }
.turn .tb { padding: 10px 12px; display: grid; gap: 8px; }
.turn.flash { box-shadow: 0 0 0 2px var(--hl); }
.sop { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; white-space: pre; }
.wid { color: var(--wid); font-weight: 500; } .wt { font-weight: 600; } .k { color: var(--muted); } .k[title] { cursor: help; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
.rf { color: var(--rf); font-weight: 500; } .str { color: var(--str); } .cm { color: var(--faint); } .ln-mention { opacity: .78; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; }
.chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.chip .p { color: var(--faint); }
.res { display: grid; gap: 4px; min-width: 0; }
.fx { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.fx .op { display: inline-block; width: 1.2em; font-weight: 600; }
.fx .op.add { color: var(--str); } .fx .op.del { color: var(--err); } .fx .op.chg { color: var(--wid); }
.answer { background: var(--code-bg); border-radius: 6px; padding: 6px 8px; }
.note { color: var(--muted); font-size: 12.5px; }
.errt { color: var(--err); overflow-wrap: anywhere; }
details.lower summary, details.cmp summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
details.lower pre { margin: 6px 0 0; font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
details.cmp summary { font-family: var(--mono); color: var(--wid); }
details.cmp summary .src { font-family: var(--font); color: var(--muted); margin-left: 6px; }
.minihead { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.minihead span { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--mono); color: var(--faint); margin-left: 6px; }
.tbl { overflow-x: auto; margin-top: 6px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.tbl th, .tbl td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tbl tbody th { font-family: var(--mono); font-weight: 500; color: var(--wid); white-space: nowrap; }
.tbl td { font-family: var(--mono); }
.tbl tr.diff td:nth-child(2), .tbl tr.diff td:nth-child(3) { background: var(--warn-soft); }
.tbl .why { font-family: var(--font); color: var(--faint); font-size: 12px; }
.lq { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.lq .key { font-family: var(--mono); color: var(--wid); font-weight: 500; overflow-wrap: anywhere; }
.lq .kind { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 6px; }
.lq .vals { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.lq .vals span { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.plug { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 6px; }
.plug.off { opacity: .6; }
.plug header { display: flex; align-items: center; gap: 10px; }
.plug h4 { margin: 0; font-size: 14.5px; font-weight: 600; flex: 1; }
.plug p { margin: 0; color: var(--muted); font-size: 13px; }
.pats { display: flex; flex-wrap: wrap; gap: 4px; }
.pats code { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.sw input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); transition: transform .15s; }
.sw input:checked { background: var(--accent); }
.sw input:checked::after { transform: translateX(14px); }
.sw input:disabled { opacity: .5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.form { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 12px; align-items: center; margin: 10px 0 12px; }
.form label { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.prog { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 10px; }
.prog div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
table.kv { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 10px; }
table.kv td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv td:last-child { text-align: right; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.rdsec { display: grid; gap: 6px; }
.rdsec + .rdsec { border-top: 1px dashed var(--line); padding-top: 8px; }
.local { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
.score { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.score .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.score .big { font-family: var(--mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.score .big span { font-size: 14px; color: var(--faint); }
.score .small { font-size: 12px; color: var(--muted); }
.bench td { font-family: var(--font); }
.bench .ok { color: var(--str); font-weight: 600; } .bench .no { color: var(--err); font-weight: 600; }
code { font-family: var(--mono); font-size: .92em; }

/* ---------- phone ---------- */
/* phone keyboard open: shrink the drawing so the conversation stays usable */
.app.kb { grid-template-rows: auto minmax(0, 24%) minmax(0, 1fr) auto auto; }
.app.kb .readout, .app.kb .sopbar { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(180px, 46%) minmax(0, 1fr) auto auto; grid-template-areas: "head" "stage" "msgs" "player" "comp"; }
  .head { border-left: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .msgs, .player, .comp { border-left: 0; }
  .msgs { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stage { border-bottom: 1px solid var(--line); }
  .rbar { padding: 6px 8px 0 16px; gap: 4px; }
  .rtab { padding: 7px 8px 8px; font-size: 13.5px; }
  .tools { gap: 0; }
  .tools .ib { width: 34px; height: 34px; }
  .sop.mini { max-height: 3.6em; }
  .b { max-width: 90%; }
  .sheet { width: 100%; }
}
</style>

</head>
<body>
<div class="app">
  <header class="head">
    <div class="avatar" aria-hidden="true">@</div>
    <div class="who"><b>Sketchpad</b><span id="status">draws what you write</span></div>
    <button class="ib" type="button" id="open-settings" aria-label="History and settings" title="History and settings">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
  </header>

  <section class="stage" aria-label="Drawing">
    <div class="rbar">
      <div class="rtabs" id="rtabs" role="tablist" aria-label="Readers"></div>
      <div class="tools">
        <button class="ib" type="button" id="align-btn" hidden aria-label="Copy this drawing to the other tabs" title="Copy this drawing to the other tabs"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button class="ib" type="button" id="view-btn" aria-label="Show the whole canvas" title="Show the whole canvas"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="ib" type="button" data-say="Undo" data-sop="@t1 command action=undo" aria-label="Undo" title="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="ib" type="button" data-say="Redo" data-sop="@t1 command action=redo" aria-label="Redo" title="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button class="ib" type="button" data-say="Clear the canvas" data-sop="@m1 mention quantifier=all&#10;@t1 command action=delete target=$m1" aria-label="Clear the canvas" title="Clear the canvas"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
      </div>
    </div>
    <div class="board">
      <svg id="canvas" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Diagram">
        <defs><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" style="fill: var(--grid)"/></pattern></defs>
        <rect id="bg" x="-5000" y="-5000" width="20000" height="20000" fill="url(#dots)"/>
        <g id="frames"></g>
        <g id="layer"></g>
      </svg>
      <div class="readout" id="readout">0 shapes</div>
      <div class="rcard" id="rcard" hidden></div>
    </div>
  </section>

  <main class="msgs" id="msgs" aria-live="polite" aria-label="Conversation"></main>

  <div class="player" id="player" hidden></div>

  <div class="comp" id="composer">
    <button class="ib" type="button" id="open-examples" aria-label="Examples" title="Examples"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="field"><textarea id="say" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea></div>
    <button class="send" type="button" id="send-btn" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title">
  <div class="sheet-head"><h2 id="sheet-title">Examples</h2><button class="ib" type="button" id="close-sheet" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <nav class="stabs" id="stabs" role="tablist"></nav>
  <div class="sbody" id="sbody"></div>
</aside>

<script src="js/learned-cues.js"></script>
<script src="js/logic.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/neural.js"></script>
<script type="module" src="js/bench-canon.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
